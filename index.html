<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfolio artesanal de Carmen" />
  <title>Carmen · Hecho a mano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <img src="img/logo.png" alt="Logo" class="site-logo">
  <div class="intro-message" id="introMessage" aria-hidden="true">
    <img src="img/presentacion-carmen.png" alt="Me llamo Carmen y mi marca es dookiezookie">
  </div>
  <main class="site">
    <section class="hero" id="inicio" aria-label="Presentación">
      <div class="grain"></div>

      <div class="hero-copy">
        
        <img class="handwritten-title" src="img/frase-mayuscula.png" alt="Hola, soy Carmen" />
      
      </div>

      <button class="face-button" id="openCatalog" aria-label="Abrir catálogo">
        <span class="orbit orbit-one"></span>
        <span class="orbit orbit-two"></span>

        <span class="doodle doodle-yellow-1"><img src="img/estrella amarilla.png" alt="" /></span>
        <span class="doodle doodle-green-1"><img src="img/estrella verde.png" alt="" /></span>
        <span class="doodle doodle-orange-1"><img src="img/estrella naranja.png" alt="" /></span>
        <span class="doodle doodle-yellow-star"><img src="img/estrella amarilla.png" alt="" /></span>
        <span class="doodle doodle-orange-star"><img src="img/estrella naranja.png" alt="" /></span>
        <span class="doodle doodle-green-star"><img src="img/estrella verde.png" alt="" /></span>
        <span class="doodle doodle-handwriting"><img src="img/garabato.png" alt="" /></span>

        <img class="face-illustration" src="img/cara.png" alt="Ilustración de Carmen" />
        <img class="tap-note" src="img/tocamicara.png" alt="Toca mi cara, porfa" />
      </button>

      <div class="hero-note">complementos · decor · ilustración<br>y más cosas bien chulas!!</div>
    </section>

    <section class="catalog" id="catalogo" aria-hidden="true">
      <div class="catalog-inner">
        <header class="catalog-header">
          <div>
            <p class="eyebrow">MI SIMPÁTICO PORTFOLIO</p>
            <h2>Todo hecho a mano <br>con una pechá de cariño.</h2>
          </div>
          <button class="close-button" id="closeCatalog" aria-label="Cerrar catálogo">×</button>
        </header>

        <div class="filters" aria-label="Categorías">
          <button class="filter active" data-filter="todos">DE TO' UN POCO</button>
          <button class="filter" data-filter="ceramica">COMPLEMENTOS</button>
          <button class="filter" data-filter="joyas">DECOR</button>
          <button class="filter" data-filter="ilustracion">ILUSTRACIÓN</button>
        </div>

        <!-- ENCABEZADOS DE CATEGORÍA -->

<div class="category-heading category-heading-todo">
  <img src="img/popurri.png" alt="Todo" />
</div>

<div class="category-heading category-heading-complementos">
  <img src="img/xuleriah.png" alt="Complementos" />
</div>

<div class="category-heading category-heading-decor">
  <img src="img/padecorar.png" alt="Decor" />
</div>

        <section class="todo-section" data-category-section="todo" aria-label="De to un poco">
          <div class="todo-wall">
        
            <article
              class="todo-piece todo-llaveros"
              data-name="LLAVEROS"
              data-description="Hechos con lana (usando punch needle!) pa' llevar algo blandito y divertido contigo."
              data-price=""
            >
              <img src="img/popurri/llaveros pn.png" alt="Llaveros" loading="lazy" />
            </article>
        
            <article
              class="todo-piece todo-llaveroterelu"
              data-name="ENCARGO LLAVEROS"
              data-description="A quién no le va a gustar un llavero de su familia peluda o de la Terelu? Pregunto."
              data-price=""
            >
              <img src="img/popurri/llaverospers.png" alt="Llaveroterelu" loading="lazy" />
            </article>
        
            <article
              class="todo-piece todo-neceser"
              data-name="NECESER"
              data-description="De tela pintado con pintura textil y con un monísimo Nevado... uoOOOOOOH"
              data-price=""
            >
              <img src="img/popurri/neceser.png" alt="Neceser" loading="lazy" />
            </article>
        
            <article
              class="todo-piece todo-portavelas"
              data-name="PORTAVELAS"
              data-description="De arcilla de secado al aire + resina pa' sellar. A meter color en casa YA!!!"
              data-price=""
            >
              <img src="img/popurri/portavelas.png" alt="Portavelas" loading="lazy" />
            </article>
        
            <article
              class="todo-piece todo-posavasos"
              data-name="POSAVASOS"
              data-description="Posavasos de lana y fieltro pa' acompañar tu cafelito mañanero."
              data-price=""
            >
              <img src="img/popurri/posavasos.png" alt="Posavasos" loading="lazy" />
            </article>
        
          </div>
        </section>

        <section class="complementos-section" data-category-section="complementos" aria-label="Complementos">
          <div class="complementos-wall">
            <article class="complementos-piece complementos-penddivertidos" data-name="PENDIENTES DIVERTIDOS" data-description="Hechos con arcilla de secado al aire con la intención DE QUE VUELVA LO CAMP!" data-price="">
              <img src="img/complementos/penddivertidos.png" alt="Pendientes divertidos" loading="lazy" />
            </article>
            <article class="complementos-piece complementos-flores" data-name="PENDIENTES FLORES" data-description="También de arcilla pero más normalicos... y con su toquesito de coló." data-price="">
              <img src="img/complementos/florescuadrado.png" alt="Pendientes de flores" loading="lazy" />
            </article>
            <article class="complementos-piece complementos-disfrutones" data-name="PENDIENTES DISFRUTONA" data-description="Hechos son shrink plastic + resina. Que nunca falte el color y la personalidad, é o no?" data-price="">
              <img src="img/complementos/penddisfrutones.png" alt="Pendientes disfrutones" loading="lazy" />
            </article>
            <article class="complementos-piece complementos-anillos" data-name="ANILLOS" data-description="Frutas y hortalizas coquetonas hechas anillo con shrink plastic y resina." data-price="">
              <img src="img/complementos/anillos.png" alt="Anillos" loading="lazy" />
            </article>
            <article class="complementos-piece complementos-pines" data-name="PINES" data-description="Tocará ponerse algo xulo en el bolso, la camiseta, la corbata..." data-price="">
              <img src="img/complementos/pines.png" alt="Pines" loading="lazy" />
            </article>
            <article class="complementos-piece complementos-totebag" data-name="TOTE BAG" data-description="Bolsa de tela pa' llevar de paseo o a la compra. Por las antifascistas!!!" data-price="">
              <img src="img/complementos/totebag.png" alt="Totebag" loading="lazy" />
            </article>
            <article class="complementos-piece complementos-rugrats" data-name="PENDIENTES RUGRATS" data-description="Esta moñekota desquiciada y yo? La misma persona." data-price="">
              <img src="img/complementos/pend rugrats.png" alt="Pendientes Rugrats" loading="lazy" />
            </article>
          </div>
        </section>

        <section class="decor-section" data-category-section="decor" aria-label="Decor">
          <div class="decor-wall">
            <article class="decor-piece decor-snoopy" data-name="CUENCO SNOOPY" data-description="Solo pa' decoración o guardar cositas!! Con su motivo de azulejo andalú..." data-price="">
              <img src="img/decor/snoopy.png" alt="Snoopy" loading="lazy" />
            </article>
            <article class="decor-piece decor-joyero" data-name="JOYERO" data-description="De arcilla y de la mejor peli de la tierra: Pesadilla Antes de Navidad." data-price="">
              <img src="img/decor/joyero.png" alt="Joyero" loading="lazy" />
            </article>
            <article class="decor-piece decor-portaincienso" data-name="PORTA INCIENSO" data-description="También hecho con arcilla. Que la casa huela bien, pero sobre todo que sea gracias a algo cuqui." data-price="">
              <img src="img/decor/portaincienso.png" alt="Portaincienso" loading="lazy" />
            </article>
            <article class="decor-piece decor-platitos" data-name="PLATITOS" data-description="También pa' decoración o guardar anillos, pendientes y otras chuminás." data-price="">
              <img src="img/decor/platitos.png" alt="Platitos" loading="lazy" />
            </article>
            <article class="decor-piece decor-figuritas" data-name="FIGURITAS" data-description="Monerías hechas de arcilla para decorar cualquier zona de vuestra morada, omeno." data-price="">
              <img src="img/decor/figuritas.png" alt="Figuritas" loading="lazy" />
            </article>
            <article class="decor-piece decor-imanes" data-name="IMANES" data-description="A ninguna nevera debería faltarle una frasesita bien disha." data-price="">
              <img src="img/decor/imanes.png" alt="Imanes" loading="lazy" />
            </article>
            <article class="decor-piece decor-pegs" data-name="PEGATINAS" data-description="La loca de las pegatinas cuando era pequeña y ahora que tengo ya una edad..." data-price="">
              <img src="img/decor/pegs.png" alt="Pegs" loading="lazy" />
            </article>
          </div>
        </section>

        <section class="illustration-section" data-category-section="ilustracion" aria-label="Ilustración">
          <div class="illustration-heading">
            <img class="illustration-title" src="img/dibujines.png" alt="Ilustración" />
          </div>

          <div class="illustration-wall">
            <span class="wall-doodle wall-doodle-star-one"><img src="img/estrella amarilla.png" alt="" /></span>
            <span class="wall-doodle wall-doodle-scribble"><img src="img/garabato.png" alt="" /></span>
            <span class="wall-doodle wall-doodle-star-two"><img src="img/estrella verde.png" alt="" /></span>
            <span class="wall-doodle wall-doodle-star-three"><img src="img/estrella naranja.png" alt="" /></span>

            <article class="illustration-piece piece-one" tabindex="0" role="button" aria-label="Ampliar ilustración">
              <img src="img/ilustraciones/15x15.jpg" alt="Ilustración de una mujer con tocado de plumas" loading="lazy" />
            </article>
            <article class="illustration-piece piece-two" tabindex="0" role="button" aria-label="Ampliar ilustración">
              <img src="img/ilustraciones/gays-hockey.jpg" alt="Ilustración de dos personajes" loading="lazy" />
            </article>
            <article class="illustration-piece piece-three" tabindex="0" role="button" aria-label="Ampliar ilustración">
              <img src="img/ilustraciones/ilustracion-espreb.jpg" alt="Ilustración con personajes y teléfonos" loading="lazy" />
            </article>
            <article class="illustration-piece piece-four" tabindex="0" role="button" aria-label="Ampliar ilustración">
              <img src="img/ilustraciones/betis.jpg" alt="Ilustración de varios personajes" loading="lazy" />
            </article>
            <article class="illustration-piece piece-five" tabindex="0" role="button" aria-label="Ampliar ilustración">
              <img src="img/ilustraciones/one-piece.jpg" alt="Ilustración de personajes" loading="lazy" />
            </article>
            <article class="illustration-piece piece-six" tabindex="0" role="button" aria-label="Ampliar ilustración">
              <img src="img/ilustraciones/CHIQUITA1 copia.jpg"
                   alt="Ilustración Chiquita"
                   loading="lazy" />
            </article>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div class="illustration-lightbox" id="illustrationLightbox" aria-hidden="true">
    <div class="illustration-lightbox-backdrop"></div>
    <div class="illustration-lightbox-card" role="dialog" aria-modal="true" aria-label="Ilustración ampliada">
      <button class="illustration-lightbox-close" id="closeIllustration" aria-label="Cerrar">×</button>
      <img id="illustrationLightboxImage" src="" alt="" />
    </div>
  </div>

  <div class="modal" id="productModal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="closeModal" aria-label="Cerrar">×</button>
      <div class="modal-art" id="modalArt"></div>
      <div>
        <h2 id="modalTitle"></h2>
        <p id="modalDescription"></p>
        <strong class="modal-price" id="modalPrice"></strong>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
